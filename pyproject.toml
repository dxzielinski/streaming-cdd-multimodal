[project]
name = "streaming-ml"
version = "0.1.0"
description = "CLI and UI for streaming concept-drift detection in multimodal data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "river>=0.23.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "typing-extensions>=4.15.0",
]

[tool.uv.sources]
driftlens = { workspace = true, editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
